---
spring:
  application:
    name: hotel-search
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    # Valores por defecto para el entorno local de Docker Compose.
    # En producción u otros entornos, sobrescribir por variables de entorno.
    url: ${JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:hotel_search}
    password: ${DB_PASSWORD:hotel_search}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Pool JDBC acotado; Oracle no escala por más conexiones.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:hotel-search-consumer}
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
      close-timeout: ${KAFKA_CLOSE_TIMEOUT:10s}
    producer:
      # Esperar ACK de todas las réplicas (1 broker = 1 réplica).
      acks: all
      # Idempotencia nativa del producer ante reintentos del broker.
      enable-idempotence: true
      # Timeouts según TECHNICAL-DECISIONS.md.
      delivery-timeout-ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
      request-timeout-ms: ${KAFKA_REQUEST_TIMEOUT_MS:3000}

server:
  shutdown: graceful

logging:
  level:
    root: INFO
  structured:
    format:
      console: logstash
    json:
      rename:
        "[@timestamp]": timestamp
        "[logger_name]": logger

# Topics (creados por KafkaProducerConfig al arrancar).
app:
  kafka:
    topics:
      hotel-availability-searches: hotel_availability_searches
      hotel-search-dlt: hotel_search_dlt
